<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="682" viewBox="0 0 2048 682" role="img" aria-labelledby="title desc">
  <title id="title">Nour Jazi — AI Engineering Student</title>
  <desc id="desc">GitHub banner for Nour Jazi, focused on GenAI, LLMs, Agentic AI, and RAG, open to PFE opportunities in January 2027.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="0.55" stop-color="#121212"/>
      <stop offset="1" stop-color="#1b1715"/>
    </linearGradient>
    <linearGradient id="warmAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6B92F"/>
      <stop offset="0.55" stop-color="#E6A23A"/>
      <stop offset="1" stop-color="#C9775B"/>
    </linearGradient>
    <linearGradient id="roleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8C143"/>
      <stop offset="1" stop-color="#D58A63"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.055"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
  </defs>

  <rect width="2048" height="682" fill="url(#background)"/>
  <rect width="2048" height="682" fill="transparent" filter="url(#grain)"/>

  <!-- Personal accent inspired by the portrait's warm gold and copper palette -->
  <rect x="94" y="155" width="9" height="376" rx="4.5" fill="url(#warmAccent)"/>

  <!-- Identity -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="160" y="279" fill="#F7F3EE" font-size="132" font-weight="760" letter-spacing="-4">Nour Jazi</text>
    <text x="164" y="351" fill="url(#roleAccent)" font-size="43" font-weight="680" letter-spacing="11">AI ENGINEERING STUDENT</text>
    <text x="164" y="419" fill="#E6E1DB" font-size="39" font-weight="560" letter-spacing="0.5">GenAI &#x2022; LLMs &#x2022; Agentic AI &#x2022; RAG</text>
  </g>

  <!-- Availability badge -->
  <g transform="translate(160 462)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="800" height="70" rx="35" fill="#161616" fill-opacity="0.88" stroke="url(#warmAccent)" stroke-width="2.5"/>
    <circle cx="41" cy="35" r="13" fill="#65D05F"/>
    <text x="75" y="47" fill="#F1EDE8" font-size="29" font-weight="620">Open to PFE opportunities</text>
    <circle cx="525" cy="35" r="4.5" fill="#F3B832"/>
    <text x="550" y="47" fill="#F1EDE8" font-size="29" font-weight="620">January 2027</text>
  </g>

  <!-- Restrained data-flow motif -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1055 258 H1160 C1205 258 1214 177 1295 177 H1510 C1568 177 1582 259 1651 259 H1742 C1790 259 1807 118 1892 118 H2048"
          stroke="#E5B143" stroke-width="2.2" opacity="0.92"/>
    <path d="M1040 332 H1176 C1235 332 1248 397 1314 397 H1380 C1435 397 1468 296 1542 296 H1725 C1762 296 1785 397 1858 397 H2048"
          stroke="#B3AAA2" stroke-width="2" stroke-dasharray="7 11" opacity="0.56"/>
    <path d="M1110 423 H1365 C1415 423 1438 360 1484 360 C1535 360 1551 298 1619 298 H1760 C1815 298 1834 558 1933 558 H2048"
          stroke="#D37D5F" stroke-width="2.2" opacity="0.86"/>
    <path d="M1085 258 H1314 C1363 258 1387 477 1460 477 H1732 C1788 477 1812 556 1901 556 H2048"
          stroke="#F1B930" stroke-width="2.1" opacity="0.82"/>
  </g>

  <!-- Nodes -->
  <g>
    <circle cx="1300" cy="258" r="11" fill="#171717" stroke="#F1B930" stroke-width="3"/>
    <circle cx="1510" cy="177" r="8" fill="#F2B947"/>
    <circle cx="1651" cy="259" r="7" fill="#E8D3BF"/>
    <circle cx="1725" cy="296" r="7" fill="#D88A67"/>
    <circle cx="1607" cy="397" r="7" fill="#F1B930"/>
    <circle cx="1460" cy="360" r="5" fill="#E1B06A"/>
    <circle cx="1733" cy="477" r="7" fill="#E2C2A6"/>
    <circle cx="1110" cy="423" r="7" fill="#D77E5E"/>
    <rect x="1851" y="385" width="24" height="24" fill="#171717" stroke="#C97359" stroke-width="3"/>
  </g>
</svg>
