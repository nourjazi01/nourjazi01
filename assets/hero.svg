<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Nour Jazi — AI Engineering</title>
  <desc id="description">Multi-agent systems, computer vision, and retrieval-augmented generation. Open to a six-month PFE internship from January 2027.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#0b1f35" />
      <stop offset="1" stop-color="#102a43" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.55" stop-color="#818cf8" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.20" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)" />
  <circle cx="1080" cy="70" r="230" fill="url(#glow)" />
  <circle cx="100" cy="330" r="190" fill="url(#glow)" opacity="0.6" />

  <g opacity="0.24" fill="none" stroke="#7dd3fc">
    <path d="M900 72 L1000 118 L1088 72 L1150 134" />
    <path d="M940 212 L1025 166 L1120 214" />
    <circle cx="900" cy="72" r="6" fill="#7dd3fc" />
    <circle cx="1000" cy="118" r="6" fill="#7dd3fc" />
    <circle cx="1088" cy="72" r="6" fill="#7dd3fc" />
    <circle cx="1150" cy="134" r="6" fill="#7dd3fc" />
    <circle cx="940" cy="212" r="6" fill="#7dd3fc" />
    <circle cx="1025" cy="166" r="6" fill="#7dd3fc" />
    <circle cx="1120" cy="214" r="6" fill="#7dd3fc" />
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="58" width="8" height="244" rx="4" fill="url(#accent)" />
    <text x="112" y="128" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="-1">Nour Jazi</text>
    <text x="114" y="179" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="3">AI ENGINEERING</text>
    <text x="114" y="229" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Multi-Agent Systems  •  Computer Vision  •  RAG</text>
    <g transform="translate(114 256)">
      <rect width="432" height="46" rx="23" fill="#172554" stroke="#818cf8" stroke-opacity="0.75" />
      <circle cx="25" cy="23" r="7" fill="#4ade80" />
      <text x="44" y="30" fill="#e0e7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Open to PFE opportunities · January 2027</text>
    </g>
  </g>
</svg>
